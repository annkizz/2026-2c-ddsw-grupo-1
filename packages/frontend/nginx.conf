server {
    listen 8080;
    server_name _;
    include /etc/nginx/nginx-app.conf;

    location = /healthcheck-nginx {
        return 204;
    }
}

server {
    listen 80;
    server_name ${APP_DOMAIN};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://${APP_DOMAIN}$request_uri;
    }
}
