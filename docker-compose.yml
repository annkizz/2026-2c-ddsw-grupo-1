# Levanta MongoDB, API, frontend y proxy HTTPS. El seed se ejecuta manualmente.
# Desde la raiz del proyecto:  docker compose up -d --build
# Las variables ${...} salen del archivo .env de la raiz (ver DESPLIEGUE.md).

x-api-env: &api-env # variables que comparten la API y el seed
  SERVER_PORT: 3000
  # "mongo" es el nombre del servicio de abajo (NO localhost). La contraseña
  # no debe tener caracteres especiales (@ : / ?) porque va dentro de la URL.
  MONGODB_URI: mongodb://${MONGO_USER:?Falta MONGO_USER en .env}:${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}@mongo:27017
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-codigo_a_voluntad}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  LOGTO_ISSUER: ${LOGTO_ISSUER:?Falta LOGTO_ISSUER en .env}
  LOGTO_JWKS_URL: ${LOGTO_JWKS_URL:?Falta LOGTO_JWKS_URL en .env}
  LOGTO_AUDIENCE: ${LOGTO_AUDIENCE:?Falta LOGTO_AUDIENCE en .env}
  LOGTO_ADMIN_IDS: ${LOGTO_ADMIN_IDS:-}
  # Dirección pública del sitio: los mails llevan un enlace para leer el mensaje en la app.
  FRONTEND_URL: https://${APP_DOMAIN:-localhost}
  # Linkedin: publicar logros. Si quedan vacías, la app avisa "integración no configurada".
  LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
  LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
  LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-https://${APP_DOMAIN:-localhost}/linkedin/callback}
  LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202608}
  LINKEDIN_STATE_SECRET: ${LINKEDIN_STATE_SECRET:-}
  LINKEDIN_TOKEN_KEY: ${LINKEDIN_TOKEN_KEY:-}
  # Tareas programadas y matching en lote (ver DESPLIEGUE.md, "Tareas programadas"). Vacías = valores por defecto.
  CRON_CIERRE_AUTOMATICO: ${CRON_CIERRE_AUTOMATICO:-}
  CRON_MATCHING: ${CRON_MATCHING:-}
  CRON_MATCHING_COMPLETO: ${CRON_MATCHING_COMPLETO:-}
  MATCHING_UMBRAL_CAMBIOS: ${MATCHING_UMBRAL_CAMBIOS:-}
  MATCHING_ESPERA_MAXIMA_MIN: ${MATCHING_ESPERA_MAXIMA_MIN:-}
  # Envío de notificaciones por mail (ver DESPLIEGUE.md, "Notificaciones"). Sin SMTP_HOST queda SIMULADO.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment: # crea el usuario administrador la PRIMERA vez que se inicializa el volumen
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db # los datos viven en este "disco" y sobreviven a reinicios
    ports:
      - "127.0.0.1:27017:27017" # acceso local para Compass; no se expone a la red
    healthcheck: # Docker pregunta si Mongo ya esta listo para recibir conexiones
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: . # usa el Dockerfile de la raiz
    image: codigo-a-voluntad-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment: *api-env
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000" # acceso local; el frontend proxya la API
    healthcheck: # usa la ruta /healthcheck de la API
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/healthcheck >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  seed: # tarea manual: carga datos iniciales
    profiles: ["seed"]
    build: .
    image: codigo-a-voluntad-api
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment: *api-env
    command: ["node", "packages/backend/seeds/seed.js"]

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_LOGTO_ENDPOINT: ${REACT_APP_LOGTO_ENDPOINT:?Falta REACT_APP_LOGTO_ENDPOINT en .env}
        REACT_APP_LOGTO_APP_ID: ${REACT_APP_LOGTO_APP_ID:?Falta REACT_APP_LOGTO_APP_ID en .env}
        REACT_APP_LOGTO_RESOURCES: ${REACT_APP_LOGTO_RESOURCES:?Falta REACT_APP_LOGTO_RESOURCES en .env}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mongo-data:
  caddy-data:
  caddy-config:
